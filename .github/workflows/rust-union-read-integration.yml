name: Rust UnionRead Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'fluss-rust/crates/fluss-lake/**'
      - 'fluss-rust/crates/fluss/src/client/admin.rs'
      - 'fluss-rust/crates/fluss/src/client/connection.rs'
      - 'fluss-rust/crates/fluss/src/client/metadata.rs'
      - 'fluss-rust/crates/fluss/src/client/table/**'
      - 'fluss-rust/crates/fluss/src/error.rs'
      - 'fluss-rust/crates/fluss/src/metadata/**'
      - 'fluss-rust/crates/fluss/src/row/**'
      - 'fluss-rust/crates/fluss/src/record/**'
      - 'fluss-rust/crates/fluss/src/rpc/**'
      - 'fluss-rust/crates/fluss/src/predicate/**'
      - 'fluss-rust/Cargo.toml'
      - 'fluss-rust/Cargo.lock'
      - 'fluss-rust/rust-toolchain.toml'
      - 'fluss-rust/.cargo/**'
      - 'fluss-rust/crates/fluss/Cargo.toml'
      - 'fluss-lake/fluss-lake-paimon/src/test/java/org/apache/fluss/lake/paimon/flink/RustUnionReadITCase.java'
      - '.github/workflows/rust-union-read-integration.yml'
  push:
    branches: [main]
    paths:
      - 'fluss-rust/crates/fluss-lake/**'
      - 'fluss-rust/crates/fluss/src/client/admin.rs'
      - 'fluss-rust/crates/fluss/src/client/connection.rs'
      - 'fluss-rust/crates/fluss/src/client/metadata.rs'
      - 'fluss-rust/crates/fluss/src/client/table/**'
      - 'fluss-rust/crates/fluss/src/error.rs'
      - 'fluss-rust/crates/fluss/src/metadata/**'
      - 'fluss-rust/crates/fluss/src/row/**'
      - 'fluss-rust/crates/fluss/src/record/**'
      - 'fluss-rust/crates/fluss/src/rpc/**'
      - 'fluss-rust/crates/fluss/src/predicate/**'
      - 'fluss-rust/Cargo.toml'
      - 'fluss-rust/Cargo.lock'
      - 'fluss-rust/rust-toolchain.toml'
      - 'fluss-rust/.cargo/**'
      - 'fluss-rust/crates/fluss/Cargo.toml'
      - 'fluss-lake/fluss-lake-paimon/src/test/java/org/apache/fluss/lake/paimon/flink/RustUnionReadITCase.java'
      - '.github/workflows/rust-union-read-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-union-read-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tiered-union-read:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      MAVEN_OPTS: -Xmx2048m
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin
          cache: maven
      - name: Install Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-rust
          key: union-read-1.91
      - name: Build Java test dependencies
        run: ./mvnw -B --no-transfer-progress -pl fluss-lake/fluss-lake-paimon -am -DskipTests install
      - name: Precompile Rust verifier
        working-directory: fluss-rust
        run: |
          mkdir -p target
          cargo +1.91.0 test -p fluss-lake --locked --features paimon --test test_tiered_union_read --no-run --message-format=json > target/tiered-union-read-build.json
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          artifacts = [json.loads(line) for line in Path('target/tiered-union-read-build.json').read_text().splitlines()]
          binaries = [a['executable'] for a in artifacts if a.get('reason') == 'compiler-artifact' and a['target']['name'] == 'test_tiered_union_read' and a.get('executable')]
          assert len(binaries) == 1, binaries
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'FLUSS_RUST_UNION_READ_TEST_BIN={Path(binaries[0]).resolve()}\n')
          PYTHON
      - name: Test real tiering and Rust UnionRead
        run: >-
          ./mvnw -B --no-transfer-progress -pl fluss-lake/fluss-lake-paimon
          -Dtest=RustUnionReadITCase -Dfluss.rust.union-read.enabled=true
          -Dlog.dir=${{ runner.temp }}/fluss-union-read-logs
          -Dlog4j.configurationFile=${{ github.workspace }}/tools/ci/log4j.properties test
      - name: Verify the Java suite was executed
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          report = 'fluss-lake/fluss-lake-paimon/target/surefire-reports/TEST-org.apache.fluss.lake.paimon.flink.RustUnionReadITCase.xml'
          suite = ET.parse(report).getroot()
          assert int(suite.attrib['tests']) == 1, suite.attrib
          assert all(int(suite.attrib[key]) == 0 for key in ('failures', 'errors', 'skipped')), suite.attrib
          PYTHON
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-union-read-test-reports
          path: |
            fluss-lake/fluss-lake-paimon/target/surefire-reports/
            fluss-rust/target/tiered-union-read-build.json
            ${{ runner.temp }}/fluss-union-read-logs/
          if-no-files-found: warn
