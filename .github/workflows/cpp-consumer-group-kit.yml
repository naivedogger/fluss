# SPDX-License-Identifier: Apache-2.0
name: C++ consumer group ECS kit
on:
  push:
    branches: [codex/cpp-consumer-group-e2e]
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'naivedogger/fluss'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build test executable and Arrow 19 from the pinned SDK source
        run: |
          cmake -S fluss-rust/bindings/cpp/test/consumer_group_ecs -B build/group -DCMAKE_BUILD_TYPE=Debug -DFLUSS_CPP_DEP_MODE=build
          cmake --build build/group --target consumer_group_e2e --parallel 4
      - name: Bundle binary, Arrow and runner
        run: |
          mkdir -p kit/lib
          cp build/group/consumer_group_e2e fluss-rust/bindings/cpp/test/consumer_group_ecs/{run.py,README.md} kit/
          arrow=$(ldd kit/consumer_group_e2e | awk '/libarrow\.so/{print $3}')
          test -f "$arrow"
          cp -L "$arrow" "kit/lib/$(basename "$arrow")"
          strip kit/consumer_group_e2e kit/lib/*
          sudo apt-get install -y patchelf
          patchelf --set-rpath '$ORIGIN/lib' kit/consumer_group_e2e
          ldd kit/consumer_group_e2e | tee libs.txt
          ! grep -F 'not found' libs.txt
          git rev-parse HEAD > kit/REVISION
          tar czf consumer-group-kit.tgz kit
      - uses: actions/upload-artifact@v4
        with:
          name: consumer-group-linux-x86_64
          path: consumer-group-kit.tgz
