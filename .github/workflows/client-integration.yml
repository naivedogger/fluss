# Client integration tests against a SAME-REVISION server (FIP-40 §3.2).
# Builds the Fluss server image from this source tree ONCE, caches + saves it,
# then fans out the Rust / Python / C++ / Elixir / Gateway integration suites against that
# fluss:dev image (build-once-fan-out, à la Temporal/PyFlink). The image build is
# cached on server/proto hashes, so client-only PRs reuse it instead of rebuilding.
# UnionRead interoperability uses a Java-owned Fluss/Flink fixture instead of Docker.

name: Client Integration

on:
  push:
    branches:
      - main
    paths:
      - 'fluss-rpc/src/main/proto/**'
      - 'fluss-client/**'
      - 'fluss-server/**'
      - 'fluss-common/**'
      - 'fluss-dist/**'
      - 'LICENSE-bin'
      - 'NOTICE-bin'
      - 'docker/fluss/**'
      - 'fluss-rust/crates/**'
      - 'fluss-rust/bindings/**'
      - 'fluss-rust/Cargo.toml'
      - 'fluss-rust/Cargo.lock'
      - 'fluss-rust/rust-toolchain.toml'
      - 'fluss-rust/.cargo/**'
      - 'fluss-lake/fluss-lake-paimon/**'
      - 'fluss-flink/fluss-flink-tiering/**'
      - 'fluss-gateway/**'
      - '.github/workflows/client-integration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'fluss-rpc/src/main/proto/**'
      - 'fluss-client/**'
      - 'fluss-server/**'
      - 'fluss-common/**'
      - 'fluss-dist/**'
      - 'LICENSE-bin'
      - 'NOTICE-bin'
      - 'docker/fluss/**'
      - 'fluss-rust/crates/**'
      - 'fluss-rust/bindings/**'
      - 'fluss-rust/Cargo.toml'
      - 'fluss-rust/Cargo.lock'
      - 'fluss-rust/rust-toolchain.toml'
      - 'fluss-rust/.cargo/**'
      - 'fluss-lake/fluss-lake-paimon/**'
      - 'fluss-flink/fluss-flink-tiering/**'
      - 'fluss-gateway/**'
      - '.github/workflows/client-integration.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Decide which client suites to run, mirroring the per-binding scoping the
  # standalone fluss-rust repo had: a client suite runs only when its own
  # sources, the core fluss-rs crate, or the server/proto changed. On non-PR
  # events (push to main, manual) everything runs.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      union_read: ${{ steps.filter.outputs.union_read }}
      python: ${{ steps.filter.outputs.python }}
      cpp: ${{ steps.filter.outputs.cpp }}
      elixir: ${{ steps.filter.outputs.elixir }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            all=true; changed=""
          else
            all=false
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          fi
          echo "Changed files:"; echo "$changed"
          has() { echo "$changed" | grep -qE "$1"; }
          # a change to this workflow itself should exercise every suite
          has '^\.github/workflows/client-integration\.yml' && all=true || true
          protocol=false; core=false; py=false; cpp=false; ex=false; gateway=false; union_read=false
          has '^(fluss-rpc/src/main/proto/|fluss-server/|fluss-common/|fluss-dist/|LICENSE-bin$|NOTICE-bin$|docker/fluss/)' && protocol=true || true
          has '^(fluss-rust/crates/|fluss-rust/Cargo\.)' && core=true || true
          has '^fluss-rust/bindings/python/' && py=true || true
          has '^fluss-rust/bindings/cpp/' && cpp=true || true
          has '^fluss-rust/bindings/elixir/' && ex=true || true
          has '^fluss-gateway/' && gateway=true || true
          has '^(fluss-rust/(crates/(fluss-lake/|fluss/)|Cargo\.|rust-toolchain\.toml$|\.cargo/)|fluss-client/|fluss-lake/fluss-lake-paimon/|fluss-flink/fluss-flink-tiering/)' && union_read=true || true
          if [ "$all" = true ] || [ "$protocol" = true ]; then union_read=true; fi
          # a suite runs if: non-PR (all) OR core crate OR server/proto OR its own sources changed
          gate() { if [ "$all" = true ] || [ "$core" = true ] || [ "$protocol" = true ] || [ "$1" = true ]; then echo true; else echo false; fi; }
          {
            echo "rust=$(gate false)"
            echo "union_read=$union_read"
            echo "python=$(gate $py)"
            echo "cpp=$(gate $cpp)"
            echo "elixir=$(gate $ex)"
            echo "gateway=$(gate $gateway)"
          } >> "$GITHUB_OUTPUT"

  # Build the server image from THIS source tree once; cache it on server/proto
  # hashes so client-only PRs restore it instead of rebuilding. The saved image
  # is uploaded as an artifact and loaded by the Docker-backed integration jobs.
  build-server-image:
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true' || needs.detect-changes.outputs.python == 'true' || needs.detect-changes.outputs.cpp == 'true' || needs.detect-changes.outputs.elixir == 'true' || needs.detect-changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache server image
        id: image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/fluss-dev.tar
          key: fluss-dev-image-${{ hashFiles('fluss-server/**', 'fluss-common/**', 'fluss-rpc/**', 'fluss-dist/**', 'LICENSE-bin', 'NOTICE-bin', 'docker/fluss/**', 'pom.xml') }}

      - name: Set up JDK 17
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build server image (fluss:dev) from source
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          ./mvnw -B --no-transfer-progress clean package -pl fluss-dist -am -DskipTests
          cmp LICENSE-bin build-target/LICENSE
          cmp NOTICE-bin build-target/NOTICE
          rm -rf docker/fluss/build-target
          mkdir -p docker/fluss/build-target
          cp -r build-target/* docker/fluss/build-target/
          docker build -t fluss:dev docker/fluss
          docker run --rm --network none --read-only --entrypoint /bin/sh fluss:dev \
            -c 'test -s /opt/fluss/LICENSE && test -s /opt/fluss/NOTICE'
          docker save fluss:dev -o /tmp/fluss-dev.tar

      - name: Upload server image
        uses: actions/upload-artifact@v4
        with:
          name: fluss-dev-image
          path: /tmp/fluss-dev.tar
          retention-days: 1

  rust-integration:
    needs: [detect-changes, build-server-image]
    if: needs.detect-changes.outputs.rust == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fluss-rust
    env:
      FLUSS_IMAGE: fluss
      FLUSS_VERSION: dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: fluss-dev-image
          path: /tmp
      - name: Load server image
        run: docker load -i /tmp/fluss-dev.tar
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-rust
      - name: Integration tests
        run: cargo test --features integration_tests --test test_fluss -p fluss-rs
        env:
          RUST_LOG: DEBUG
          RUST_BACKTRACE: full

  rust-union-read:
    name: "Rust UnionRead"
    needs: detect-changes
    if: needs.detect-changes.outputs.union_read == 'true'
    permissions:
      contents: read
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      MAVEN_OPTS: -Xmx2048m
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin
          cache: maven
      - name: Install Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-rust
          key: union-read-1.91
      - name: Build Java test dependencies
        run: ./mvnw -B --no-transfer-progress -pl fluss-lake/fluss-lake-paimon -am -DskipTests install
      - name: Precompile Rust verifier
        working-directory: fluss-rust
        run: |
          mkdir -p target
          cargo +1.91.0 test -p fluss-lake --locked --features paimon --test test_tiered_union_read --no-run --message-format=json > target/tiered-union-read-build.json
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          artifacts = [json.loads(line) for line in Path('target/tiered-union-read-build.json').read_text().splitlines()]
          binaries = [a['executable'] for a in artifacts if a.get('reason') == 'compiler-artifact' and a['target']['name'] == 'test_tiered_union_read' and a.get('executable')]
          assert len(binaries) == 1, binaries
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'FLUSS_RUST_UNION_READ_TEST_BIN={Path(binaries[0]).resolve()}\n')
          PYTHON
      - name: Test real tiering and Rust UnionRead
        run: >-
          ./mvnw -B --no-transfer-progress -pl fluss-lake/fluss-lake-paimon
          -Dtest=RustUnionReadITCase -Dfluss.rust.union-read.enabled=true
          -Dlog.dir=${{ runner.temp }}/fluss-union-read-logs
          -Dlog4j.configurationFile=${{ github.workspace }}/tools/ci/log4j.properties test
      - name: Verify the Java suite was executed
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          report = 'fluss-lake/fluss-lake-paimon/target/surefire-reports/TEST-org.apache.fluss.lake.paimon.flink.RustUnionReadITCase.xml'
          suite = ET.parse(report).getroot()
          assert int(suite.attrib['tests']) == 6, suite.attrib
          assert all(int(suite.attrib[key]) == 0 for key in ('failures', 'errors', 'skipped')), suite.attrib
          PYTHON
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-union-read-test-reports
          path: |
            fluss-lake/fluss-lake-paimon/target/surefire-reports/
            fluss-rust/target/tiered-union-read-build.json
            ${{ runner.temp }}/fluss-union-read-logs/
          if-no-files-found: warn

  gateway-integration:
    needs: [detect-changes, build-server-image]
    if: needs.detect-changes.outputs.gateway == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fluss-gateway
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: fluss-dev-image
          path: /tmp
      - name: Load server image
        run: docker load -i /tmp/fluss-dev.tar
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            fluss-gateway
            fluss-rust
      - name: Build Fluss test cluster helper
        run: cargo build --locked --manifest-path ../fluss-rust/Cargo.toml -p fluss-test-cluster
      - name: Integration Test
        run: cargo test --locked --features integration_tests --test e2e_cluster
        env:
          FLUSS_TEST_CLUSTER_BIN: ${{ github.workspace }}/fluss-rust/target/debug/fluss-test-cluster
          FLUSS_IMAGE: fluss
          FLUSS_VERSION: dev
          RUST_LOG: DEBUG
          RUST_BACKTRACE: full

  python-integration:
    needs: [detect-changes, build-server-image]
    if: needs.detect-changes.outputs.python == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: fluss-rust
    env:
      FLUSS_TEST_CLUSTER_BIN: ${{ github.workspace }}/fluss-rust/target/debug/fluss-test-cluster
      FLUSS_IMAGE: fluss
      FLUSS_VERSION: dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: fluss-dev-image
          path: /tmp
      - name: Load server image
        run: docker load -i /tmp/fluss-dev.tar
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-rust
      - name: Build fluss-test-cluster binary
        run: cargo build -p fluss-test-cluster
      - name: Build Python bindings
        working-directory: fluss-rust/bindings/python
        run: |
          uv sync --extra dev --no-install-project
          uv run --no-sync maturin develop --uv
      - name: Run tests (parallel)
        working-directory: fluss-rust/bindings/python
        run: uv run --no-sync pytest test/ -v -n 2 --dist=loadfile
        env:
          RUST_LOG: DEBUG
          RUST_BACKTRACE: full
          FLUSS_SKIP_CLUSTER_TEARDOWN: "1"
      - name: Dump fluss cluster container logs
        if: always()
        run: |
          mkdir -p cluster-logs
          for c in $(docker ps -a --filter "name=shared-test" --format '{{.Names}}'); do
            docker logs "$c" > "cluster-logs/$c.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-logs-${{ matrix.python }}
          path: fluss-rust/cluster-logs/
          if-no-files-found: ignore
          retention-days: 3

  python-stubtest:
    # Stub-drift check only needs the module importable, so it runs without the
    # test cluster or server image.
    needs: [detect-changes]
    if: needs.detect-changes.outputs.python == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fluss-rust
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-rust
      - name: Build Python bindings
        working-directory: fluss-rust/bindings/python
        run: |
          uv sync --extra dev --no-install-project
          uv run --no-sync maturin develop --uv
      - name: Check stub drift (stubtest)
        working-directory: fluss-rust/bindings/python
        run: |
          uv run --no-sync python -m mypy.stubtest fluss \
            --mypy-config-file pyproject.toml \
            --allowlist stubtest-allowlist.txt

  cpp-integration:
    needs: [detect-changes, build-server-image]
    if: needs.detect-changes.outputs.cpp == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fluss-rust
    env:
      FLUSS_TEST_CLUSTER_BIN: ${{ github.workspace }}/fluss-rust/target/debug/fluss-test-cluster
      FLUSS_IMAGE: fluss
      FLUSS_VERSION: dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: fluss-dev-image
          path: /tmp
      - name: Load server image
        run: docker load -i /tmp/fluss-dev.tar
      - name: Install Apache Arrow C++
        run: |
          sudo apt-get install -y -V ca-certificates lsb-release wget
          wget https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt-get install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt-get update
          sudo apt-get install -y -V libarrow-dev
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-rust
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Build fluss-test-cluster binary
        run: cargo build -p fluss-test-cluster
      - name: Build C++ bindings and tests
        working-directory: fluss-rust/bindings/cpp
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake -B build \
            -DFLUSS_ENABLE_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build --parallel
          sccache --show-stats
      - name: Run C++ integration tests (parallel)
        working-directory: fluss-rust/bindings/cpp
        run: cd build && ctest -j$(nproc) --output-on-failure --timeout 300
        env:
          RUST_LOG: DEBUG
          RUST_BACKTRACE: full

  elixir-integration:
    needs: [detect-changes, build-server-image]
    if: needs.detect-changes.outputs.elixir == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fluss-rust
    env:
      OTP_VERSION: "28.5.0.2"
      ELIXIR_VERSION: "1.19.5"
      FLUSS_TEST_CLUSTER_BIN: ${{ github.workspace }}/fluss-rust/target/debug/fluss-test-cluster
      MIX_ENV: test
      FLUSS_IMAGE: fluss
      FLUSS_VERSION: dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: fluss-dev-image
          path: /tmp
      - name: Load server image
        run: docker load -i /tmp/fluss-dev.tar
      - name: Set up BEAM
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fluss-rust
      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: fluss-rust/bindings/elixir/deps
          key: ${{ runner.os }}-mixdeps-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-${{ hashFiles('fluss-rust/bindings/elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mixdeps-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-
      - name: Build fluss-test-cluster binary
        run: cargo build -p fluss-test-cluster
      - name: Fetch Elixir deps
        working-directory: fluss-rust/bindings/elixir
        run: mix deps.get
      - name: Check formatting
        working-directory: fluss-rust/bindings/elixir
        run: mix format --check-formatted
      - name: Compile (warnings as errors)
        working-directory: fluss-rust/bindings/elixir
        run: mix compile --warnings-as-errors
      - name: Credo
        working-directory: fluss-rust/bindings/elixir
        run: mix credo
      - name: Cache PLT
        uses: actions/cache@v4
        with:
          path: fluss-rust/bindings/elixir/priv/plts/
          key: ${{ runner.os }}-mix-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-${{ hashFiles('fluss-rust/bindings/elixir/mix.lock') }}-plt
          restore-keys: |
            ${{ runner.os }}-mix-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-
      - name: Dialyzer
        working-directory: fluss-rust/bindings/elixir
        run: mix dialyzer
      - name: Run unit tests
        working-directory: fluss-rust/bindings/elixir
        run: mix test
      - name: Run integration tests
        working-directory: fluss-rust/bindings/elixir
        run: mix test --include integration --only integration
        env:
          RUST_LOG: DEBUG
          RUST_BACKTRACE: full
