# Copy this file to isr-storm.conf and fill in your cluster's values.
# isr-storm.conf is gitignored so real credentials never get committed.
# Pass it with:  CONFIG=/abs/path/to/isr-storm.conf ./run-isr-storm-cpp.sh ab
#
# Format: `key = value`, one per line. `#` starts a comment. Surrounding
# double quotes on a value are stripped. Explicit env vars override these.

# Fluss bootstrap endpoint (host:port). Required unless set via $BOOTSTRAP.
bootstrap = 10.0.0.1:9123

# SASL credentials. Leave these out (or blank) to connect without SASL.
# SASL is enabled as soon as sasl.username is set.
sasl.username = your-user
sasl.password = your-password

# Optional, defaults to PLAIN.
sasl.mechanism = PLAIN
